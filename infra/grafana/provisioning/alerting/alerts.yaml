# Alert rules — provisioned on boot. Thresholds match the design spec exactly:
# p99 latency > 500ms for 5m, and error rate > 1% for 5m, evaluated PER SERVICE
# (queries group by service_name, so each service alerts independently).
#
# Notification routing (Slack/PagerDuty/etc.) is intentionally NOT configured —
# rules fire into Grafana's default policy; wiring a contact point is left to
# the user (design-spec decision for v1).
#
# NOTE: lives under provisioning/alerting/, NOT dashboards/alerts.json as the
# day-7 spec sketches it — Grafana 11 unified alerting does not run rules
# embedded in dashboard JSON. The metric/label names match the dashboards and
# are pending confirmation against live Prometheus.

apiVersion: 1

groups:
  - orgId: 1
    name: telo-slo
    folder: Telo
    interval: 1m
    rules:
      - uid: telo-p99-latency
        title: 'p99 latency > 500ms'
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'p99 latency for {{ $labels.service_name }} is above 500ms'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.99, sum by (le, service_name) (rate(http_server_duration_milliseconds_bucket[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [500]

      - uid: telo-error-rate
        title: 'error rate > 1%'
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'error rate for {{ $labels.service_name }} is above 1%'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (service_name) (rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m])) / clamp_min(sum by (service_name) (rate(http_server_duration_milliseconds_count[5m])), 1e-9)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.01]
