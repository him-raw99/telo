# Prometheus — scrapes the Collector's Prometheus exporter (:8889), closing
# the metrics pull-bridge: app pushes OTLP → Collector exposes → Prometheus pulls.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
